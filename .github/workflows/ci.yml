name: Rozee Job Market Pipeline CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-pipeline:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_market

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d job_market"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/job_market
        run: |
          python src/db.py

      - name: Run sample data pipeline
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/job_market
        run: |
          python -c "from src.load import run; run('data/sample')"

      - name: Run data quality checks
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/job_market
        run: |
          python tests/data_quality.py